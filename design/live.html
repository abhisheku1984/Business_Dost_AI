  <script src="js/drive-config.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/live.js"></script>
  <script>
    /* Installable app: manifest + service worker live next to this page.
       Nothing happens on file:// — install needs http(s). */
    (function () {
      var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      var btn = document.getElementById("install-btn");
      var prompt = null;

      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () { /* offline mode is a bonus, not a requirement */ });
        });
      }

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        prompt = event;
        if (btn) btn.hidden = false;
      });

      if (btn) {
        btn.addEventListener("click", function () {
          if (prompt) {
            prompt.prompt();
            prompt.userChoice.then(function () { prompt = null; btn.hidden = true; });
          } else {
            var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
            window.live && window.live.toast(ios
              ? "On iPhone: tap Share, then “Add to Home Screen”."
              : "Use your browser menu → “Install app” / “Add to Home screen”.");
          }
        });
      }

      window.addEventListener("appinstalled", function () {
        if (btn) btn.hidden = true;
        window.live && window.live.toast("Installed — open Dost from your home screen.");
      });

      if (standalone && btn) btn.hidden = true;
    })();
  </script>
